# Deploys the Supabase edge functions (identify, drive, edit, worker, media) whenever they change on main.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (a Supabase personal access token).
# The functions' own secrets (ANTHROPIC_API_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET)
# live in Supabase > Edge Functions > Secrets, never in this repo.
name: Deploy Supabase functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:
concurrency:
  group: supabase-functions
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: cjtiiufrtmwdqgikpcxi
    steps:
      - uses: actions/checkout@v4
      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (see supabase/functions/README.md)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # The functions check the caller's sign-in themselves (allowed_emails), so the gateway's JWT check is off.
      - run: supabase functions deploy identify --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - run: supabase functions deploy drive --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      # Phase 3: edit (phone), worker (Modal only, checks WORKER_SECRET), media (signed links for the review screen)
      - run: supabase functions deploy edit --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - run: supabase functions deploy worker --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - run: supabase functions deploy media --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - name: Share WORKER_SECRET with the functions
        env:
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          if [ -n "$WORKER_SECRET" ]; then supabase secrets set --project-ref "$PROJECT_REF" WORKER_SECRET="$WORKER_SECRET" > /dev/null; fi
